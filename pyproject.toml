[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practica-mlops"
version = "2.2.0"
description = "Aplicación web MLOps para predicción agroclimática y monitoreo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Uso académico" }
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=2.1,<3.0",
  # La versión final se resolverá para Python 3.14; validar compatibilidad
  # con models/modelo.joblib, que fue entrenado con scikit-learn 1.6.1.
  "scikit-learn>=1.6.1,<2.0",
  "joblib>=1.4,<2.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.2,<5.0",
  "statsmodels>=0.14.4,<1.0",
  "gradio>=5.0,<7.0",
  "plotly>=5.24,<7.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
  "ipykernel>=6.29,<7.0",
  "jupyter>=1.1,<2.0",
  "nbconvert>=7.16,<8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "build", "dist", "output", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
